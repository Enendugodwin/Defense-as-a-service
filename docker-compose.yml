services:
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      cluster.name: cyber-cluster
      node.name: node-1
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD in your local .env}"
    networks: [platform_net]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    depends_on: [opensearch]
    environment:
      OPENSEARCH_HOSTS: "https://opensearch:9200"
      OPENSEARCH_USERNAME: "${OPENSEARCH_USER:?Set OPENSEARCH_USER in your local .env}"
      OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD in your local .env}"
    ports:
      - "${DASHBOARDS_BIND_ADDRESS:-127.0.0.1}:${DASHBOARDS_PORT:-5601}:5601"
    networks: [platform_net]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in your local .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in your local .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}"
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [platform_net]

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local .env}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local .env}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [platform_net]

  ingest-api:
    build: ./api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local .env}"
      DB_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in your local .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in your local .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}"
      REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:?Set REGISTRATION_TOKEN in your local .env}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?Set ADMIN_API_KEY in your local .env}"
      REMOTE_COMMANDS_ENABLED: "${REMOTE_COMMANDS_ENABLED:-true}"
      API_DOCS_ENABLED: "${API_DOCS_ENABLED:-false}"
      SESSION_IDLE_TIMEOUT_SECONDS: "${SESSION_IDLE_TIMEOUT_SECONDS:-900}"
    ports:
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:${INGEST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [platform_net]

  log-processor:
    build: ./processor
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local .env}"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_USER: "${OPENSEARCH_USER:?Set OPENSEARCH_USER in your local .env}"
      OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD in your local .env}"
      OPENSEARCH_VERIFY_CERTS: "${OPENSEARCH_VERIFY_CERTS:-false}"
    networks: [platform_net]

  syslog-receiver:
    build: ./syslog-receiver
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local .env}"
      SYSLOG_PORT: "514"
    ports:
      - "${SYSLOG_BIND_ADDRESS:-127.0.0.1}:${SYSLOG_HOST_PORT:-514}:514/udp"
    networks: [platform_net]

  c2-web:
    build: ./c2-web
    depends_on:
      ingest-api:
        condition: service_healthy
    environment:
      API_URL: http://ingest-api:8000
      ADMIN_API_KEY: "${ADMIN_API_KEY:?Set ADMIN_API_KEY in your local .env}"
      C2_WEB_HOST: "0.0.0.0"
      C2_WEB_PORT: "8081"
    ports:
      - "127.0.0.1:${C2_WEB_PORT:-8081}:8081"
    networks: [platform_net]

networks:
  platform_net:
    driver: bridge
